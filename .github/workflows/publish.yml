name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for Trusted Publishing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # NO registry-url - it pollutes NODE_AUTH_TOKEN with GITHUB_TOKEN,
          # which blocks Trusted Publishing OIDC detection.

      - name: Upgrade npm to >=11.5.1 (Trusted Publishing support)
        run: npm install -g npm@latest

      - name: Confirm npm version
        run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify package.json version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: pkg=$PKG_VERSION tag=$TAG_VERSION"
            exit 1
          fi

      - name: Publish to npm (Trusted Publishing / OIDC)
        run: npm publish --access public --provenance
